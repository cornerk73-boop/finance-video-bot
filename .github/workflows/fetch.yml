name: Fetch finance news

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Install ffmpeg and Hindi font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-lohit-deva

      - name: Fetch headlines
        run: python fetch_news.py

      - name: Write Hindi script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python write_script.py

      - name: Make Hindi voice
        run: python make_voice.py

      - name: Download free images
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python fetch_images.py

      - name: Make subtitles
        run: python make_subs.py

      - name: Build video
        run: python build_video.py

      - name: Save outputs
        uses: actions/upload-artifact@v4
        with:
          name: outputs
          path: |
            final.mp4
            description.txt
            script.json
            voice.mp3
